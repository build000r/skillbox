# DCG external pack: credential-shaped literals on a command line.
#
# The bead assumed dcg config supported only [[allow]] overrides. It does not:
# dcg 0.6.7 loads external packs via `[packs].custom_paths`, and `dcg pack
# validate` accepts this file. This pack is the DCG half of
# skillbox-secret-prompt-guard-q3ya; scripts/secret-prompt-guard is the other
# half, and both are needed because DCG only sees Bash/PreToolUse. A human
# typing `amp -x` in a terminal, or any non-Bash tool invocation, never reaches
# this pack — which is exactly how the 2026-07-30 key was burned.
#
# NOT YET LOADED. Loading requires `[packs].custom_paths` in .dcg.toml, which is
# generated by runtime_manager.dcg_policy — a file this bead's brief puts out of
# bounds. The proposed integration is recorded in WG-q3ya_RESULT.md.
#
# Every pattern here is anchored on a vendor-assigned prefix rather than on
# entropy. Prefix matching has a far lower false-positive rate than "looks
# random", and these prefixes are what actually leak.
#
# No real secret appears in this file. The examples are synthetic shapes.
id: secrets.prompt_guard
name: Credential-shaped literals in argv
version: 1.0.0
description: >
  Blocks commands whose arguments carry a credential-shaped literal, so a key
  never reaches a shell history, a process table, or an agent transcript.
  Remediation is always the same: deliver the value as an environment variable
  (amp secrets set --user) and reference its NAME in the prompt.

keywords:
  - tskey-auth-
  - sk-
  - AKIA
  - ghp_
  - Bearer

destructive_patterns:
  - name: tailscale_auth_key_literal
    pattern: 'tskey-auth-[A-Za-z0-9]{8,}-'
    severity: critical
    description: A Tailscale auth key appears literally in the command.
    message: >
      Tailscale auth key literal on the command line. Rotate it if this ran.
    explanation: >
      On 2026-07-30 a tag:orb auth key was embedded in an `amp -x` prompt and
      had to be rotated. A key on a command line exists in the shell history,
      the process table, and the agent transcript simultaneously, and none of
      those can be retracted. Pass the key through the environment instead:
      `amp secrets set --user TS_AUTHKEY`, then reference TS_AUTHKEY by name.

  - name: openai_style_key_literal
    pattern: 'sk-[A-Za-z0-9]{20,}'
    severity: critical
    description: An sk- prefixed API key appears literally in the command.
    message: >
      `sk-` API key literal on the command line.
    explanation: >
      Provider keys with the `sk-` prefix are bearer credentials: whoever reads
      the transcript holds the key. Store it with `amp secrets set --user` and
      reference the variable name.

  - name: aws_access_key_id_literal
    pattern: 'AKIA[0-9A-Z]{16}'
    severity: critical
    description: An AWS access key id appears literally in the command.
    message: >
      AWS access key id literal on the command line.
    explanation: >
      An AKIA id is half of a long-lived credential pair and is enough to start
      an attack on the other half. Use an environment value or an instance role.

  - name: github_pat_literal
    pattern: 'ghp_[A-Za-z0-9]{30,}'
    severity: critical
    description: A GitHub personal access token appears literally in the command.
    message: >
      GitHub personal access token literal on the command line.
    explanation: >
      A `ghp_` token grants repository access under a real identity. Deliver it
      through the environment; never through a prompt or an argument.

  - name: bearer_token_literal
    pattern: 'Bearer [A-Za-z0-9._-]{40,}'
    severity: high
    description: A literal Authorization bearer token appears in the command.
    message: >
      Bearer token literal on the command line.
    explanation: >
      A pasted `Authorization: Bearer …` header puts a live session token into
      the transcript. Build the header from an environment variable at call
      time instead.
