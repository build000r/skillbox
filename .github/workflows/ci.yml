name: CI

# Trust boundary (skillbox-6r53):
#   * pull_request      - untrusted contributions still get the full hosted matrix
#   * workflow_dispatch - manual recovery when the local gate is unavailable
#   * push              - deliberately absent. Trusted-main commits are gated by
#                         the canonical local gate (scripts/self-test.sh), which
#                         runs these same lanes against an isolated exact-SHA
#                         checkout and is enforced by .githooks/pre-push.
# The pinned versions below are the single hosted copy of the tool matrix and
# are contract-tested for equality with scripts/self-test.sh.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUFF_VERSION: "0.15.20"
  SHELLCHECK_PY_VERSION: "0.11.0.1"
  COVERAGE_VERSION: "7.15.0"
  PYYAML_VERSION: "6.0.3"
  CRYPTOGRAPHY_VERSION: "49.0.0"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml

      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check "ruff==${RUFF_VERSION}"

      - name: Run Ruff
        run: python -m ruff check .

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml

      - name: Install ShellCheck
        run: python -m pip install --disable-pip-version-check "shellcheck-py==${SHELLCHECK_PY_VERSION}"

      - name: Run ShellCheck
        # .githooks/* is included because the pre-push hook is now a gate, not a
        # convenience: it must be linted wherever the shell lint runs.
        run: shellcheck --severity=warning scripts/*.sh install.sh .githooks/pre-commit .githooks/pre-push

  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml

      - name: Install Python dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            "PyYAML==${PYYAML_VERSION}" \
            "cryptography==${CRYPTOGRAPHY_VERSION}"

      - name: Render outer model
        run: python scripts/04-reconcile.py render >/tmp/skillbox-render.json

  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml

      - name: Install Python dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            "PyYAML==${PYYAML_VERSION}" \
            "cryptography==${CRYPTOGRAPHY_VERSION}"

      # The SAME command the canonical local gate runs (scripts/self-test.sh,
      # lane "contract"). This job is the hosted copy for pull requests, not a
      # second authority: it must never diverge from that lane. Read-only, so a
      # fresh checkout with no Docker, no network and no operator state is all
      # it needs.
      - name: Lint the cross-surface command contract
        run: python .env-manager/manage.py contract-lint --format json

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml

      - name: Install Python dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            "PyYAML==${PYYAML_VERSION}" \
            "cryptography==${CRYPTOGRAPHY_VERSION}"

      # The single-mutator contract: the inventory ratchet (every public surface
      # classified) plus the cross-surface proof (one canonical root, one
      # writer, and every mutating boundary gated or reviewed). Both spawn only
      # local subprocesses against throwaway roots -- no Docker, no network, no
      # operator state -- so a fresh checkout is all this job needs.
      - name: Prove the single-mutator state-root contract
        run: |
          python -m unittest \
            tests.test_state_mutation_inventory \
            tests.test_state_mutation_integration

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml

      - name: Install Python dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            "PyYAML==${PYYAML_VERSION}" \
            "cryptography==${CRYPTOGRAPHY_VERSION}" \
            "coverage==${COVERAGE_VERSION}"

      - name: Run unit tests
        if: matrix.python-version != '3.12'
        run: python -m unittest discover -s tests

      - name: Run coverage
        if: matrix.python-version == '3.12'
        run: |
          python -m coverage erase
          python -m coverage run --source=scripts,.env-manager -m unittest discover -s tests
          python -m coverage report -m --skip-covered --fail-under=80
          python -m coverage xml -o coverage.xml

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate compose config
        run: docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.monoserver.yml config -q
